name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Testes de integração
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  image:
    name: Imagem
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      # O padrao do projeto e MySQL. O smoke test sobe a imagem contra este banco,
      # entao o pipeline valida o mesmo caminho usado na entrega.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bikes
          MYSQL_USER: bikes
          MYSQL_PASSWORD: bikes
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags e labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build e push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test da imagem com MySQL
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE="$(echo "$IMAGE_TAGS" | head -n1)"
          trap 'docker logs bikes-smoke --tail 60; docker rm -f bikes-smoke' EXIT
          # --network host faz o container enxergar o MySQL do job em 127.0.0.1:3306.
          docker run -d --name bikes-smoke --network host \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SPRING_DATASOURCE_URL='jdbc:mysql://127.0.0.1:3306/bikes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo' \
            -e SPRING_DATASOURCE_USERNAME=bikes \
            -e SPRING_DATASOURCE_PASSWORD=bikes \
            -e APP_DEMO_DATA=true \
            "$IMAGE"
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/ > /tmp/bikes.html; then
              break
            fi
            sleep 2
          done
          grep -qi "Locabike" /tmp/bikes.html
          curl -fsS -X POST http://localhost:8080/api/v1/auth \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin@bikes.com","password":"123456"}' \
            | grep -q '"token"'
