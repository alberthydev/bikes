name: bikes

# Padrao do projeto: aplicacao + MySQL. A imagem da aplicacao nao embute o
# servidor de banco (boa pratica: um processo por container); o MySQL roda como
# servico deste mesmo compose, com volume proprio, e a aplicacao espera o
# healthcheck antes de iniciar.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bikes
      MYSQL_USER: bikes
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bikes}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: America/Sao_Paulo
    ports:
      # Exposto para inspecao com Workbench/DBeaver. Troque se ja houver MySQL local:
      # MYSQL_PORT=3307 docker compose up -d
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - bikes-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  app:
    image: ghcr.io/alberthydev/bikes:latest
    build:
      context: .
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BIKES_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/bikes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8"
      SPRING_DATASOURCE_USERNAME: bikes
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-bikes}
      # Contas e bicicletas de demonstracao na primeira inicializacao (banco vazio).
      # Para um banco de producao, use APP_DEMO_DATA=false.
      APP_DEMO_DATA: "true"
    restart: unless-stopped

volumes:
  bikes-mysql:
