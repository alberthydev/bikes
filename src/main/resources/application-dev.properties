# Perfil de desenvolvimento/demonstracao
# Sobe a aplicacao sem MySQL: banco H2 em memoria, criado a cada inicializacao.
# Uso: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:bikes;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Console do banco para inspecionar os dados durante a demonstracao
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
