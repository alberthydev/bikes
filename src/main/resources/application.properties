spring.application.name=bikes

# LOCALE CONFIG
spring.web.locale-resolver=fixed
spring.web.locale=pt_BR

# MYSQL Config
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/bikes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root // hardcoded username
spring.datasource.password=root // hardcoded password

# JPA
spring.jpa.show-sql=true // exibe sql no log
spring.jpa.properties.hibernate.format_sql=false // exibe em uma unica linha
spring.jpa.hibernate.ddl-auto=update // cria as tabelas a partir das classes entidades
